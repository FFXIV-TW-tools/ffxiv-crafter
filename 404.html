<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>找不到這個頁面</title>
<!-- 這頁刻意**不載入任何外部資產**（不接 portal CDN、無 JS、無圖）。
     它存在的理由就是「未知路徑不要再回 200 + index.html」——若它自己又拉一串資源，
     等於把省下來的請求原地花掉，而爬蟲踩到的每一條假路徑都會再乘一次。
     色值一律 var(--color-*, 同值 fallback)：tokens.css 沒載入時走 fallback（就是現在的常態），
     哪天這頁被納入設計系統也不必回頭改。fallback 值＝tokens.css 當時的實值。 -->
<style>
  :root { color-scheme: dark; }
  body { margin:0; min-height:100vh; display:grid; place-items:center;
         background:var(--color-bg, #080c13); color:var(--color-text, #f5f5f5);
         font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
         font-size:var(--fs-body, .9375rem); }
  main { position:relative; box-sizing:border-box; width:min(480px, calc(100% - 32px));
         padding:2rem; text-align:center; background:var(--color-surface, #101824);
         border:1px solid var(--color-border, #2b3f56);
         clip-path:polygon(0 14px,14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%); }
  h1 { display:flex; align-items:center; justify-content:center; gap:1rem;
       font-size:var(--fs-h2, 1.5rem); margin:0 0 .75rem; }
  h1::before { content:""; width:12px; height:12px; flex:none; transform:rotate(45deg);
               border:2px solid var(--accent, #4ec9d0); }
  p { margin:0 0 1.5rem; color:var(--color-text-muted, #c0c9da); line-height:1.7;
      font-size:var(--fs-body, .9375rem); }
  a { display:inline-block; padding:.6rem 1.4rem; border-radius:.5rem;
      background:var(--color-surface, #101824); color:var(--color-text, #f5f5f5);
      border:1px solid var(--color-border, #2b3f56); text-decoration:none; }
  a:hover { background:var(--color-surface-hover, #18222f); }
  a:focus-visible { outline:2px solid var(--accent, #4ec9d0); outline-offset:4px; }
</style>
</head>
<body>
<main>
  <h1>找不到這個頁面</h1>
  <p>網址可能打錯，或頁面已搬走。</p>
  <a href="/">回配方求解器</a>
</main>
</body>
</html>
